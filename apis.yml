aid: ember
name: Ember
description: >-
  Ember.js is a productive, battle-tested JavaScript framework for building
  modern web applications. It includes Ember CLI for scaffolding and builds, a
  best-in-class router with async data loading, the Ember Data layer, a
  three-level testing framework, the Glimmer rendering engine, and a six-week
  release cycle that emphasizes stability and easy upgrades through automated
  codemods.
